name: Validate YAML package
description: Generate and validate the Pulumi YAML package without publishing an artifact.

inputs:
  mode:
    required: true
  terraform-provider:
  terraform-provider-version:
  provider-binary-path:
  build-command:
  provider-name:
  package-name:
    required: true
  caller-ref:
  checkout-caller:
    default: "true"
  pulumi-version:
    default: "^3"
  go-version:
    default: "1.25"

runs:
  using: composite
  steps:
    - name: Install Pulumi CLI
      uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
      with:
        pulumi-version: ${{ inputs.pulumi-version }}

    - name: Checkout caller repository
      if: inputs.mode == 'local' && inputs.checkout-caller == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.repository }}
        ref: ${{ inputs.caller-ref || github.sha }}
        path: caller-yaml
        persist-credentials: false

    - name: Set up Go
      if: inputs.mode == 'local'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - name: Run caller build command
      if: inputs.mode == 'local' && inputs.build-command != ''
      shell: bash
      working-directory: caller-yaml
      env:
        CALLER_BUILD_COMMAND: ${{ inputs.build-command }}
      run: bash -euo pipefail -c "${CALLER_BUILD_COMMAND}"

    - name: Add package to a YAML project
      id: add
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        TF_PROVIDER: ${{ inputs.terraform-provider }}
        TF_PROVIDER_VERSION: ${{ inputs.terraform-provider-version }}
        PROVIDER_BINARY_PATH: ${{ inputs.provider-binary-path }}
        PROVIDER_NAME: ${{ inputs.provider-name }}
      run: |
        set -euo pipefail
        project="${RUNNER_TEMP}/yaml-project"
        rm -rf "${project}"
        mkdir -p "${project}"
        cat >"${project}/Pulumi.yaml" <<'YAML'
        name: pulumi-sdk-yaml-validation
        runtime: yaml
        description: Ephemeral project used to validate YAML package resolution.
        YAML
        args=()
        if [[ "${MODE}" == "registry" ]]; then
          args+=("${TF_PROVIDER}" "${TF_PROVIDER_VERSION}")
        else
          target="caller-yaml/${PROVIDER_BINARY_PATH}"
          target="$(realpath "${target}")"
          args+=("${target}")
        fi
        if [[ -n "${PROVIDER_NAME}" ]]; then
          args+=(--provider-name "${PROVIDER_NAME}")
        fi
        ( cd "${project}" && pulumi package add terraform-provider "${args[@]}" )
        cat "${project}/Pulumi.yaml"
        echo "project=${project}" >> "$GITHUB_OUTPUT"

    - name: Validate generated YAML package
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
        PROJECT: ${{ steps.add.outputs.project }}
        PACKAGE_NAME: ${{ inputs.package-name }}
        MODE: ${{ inputs.mode }}
        TF_PROVIDER: ${{ inputs.terraform-provider }}
        TF_PROVIDER_VERSION: ${{ inputs.terraform-provider-version }}
      run: |
        set -euo pipefail
        args=(--project-dir "${PROJECT}" --package-name "${PACKAGE_NAME}")
        if [[ "${MODE}" == "registry" ]]; then
          args+=(
            --expect-package-version "${TF_PROVIDER_VERSION}"
            --expect-parameter "${TF_PROVIDER}"
            --expect-parameter "${TF_PROVIDER_VERSION}"
          )
        fi
        python3 "${ACTION_DIR}/../../scripts/validate_yaml_package.py" "${args[@]}"
