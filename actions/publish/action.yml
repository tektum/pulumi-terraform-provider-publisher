name: Publish package SDK artifacts
description: Idempotently publish npm, PyPI, NuGet, and Maven SDK artifacts and verify registry visibility.

inputs:
  sdks:
    description: Comma-separated subset of nodejs,python,dotnet,java
    required: true
  version:
    required: true
  npm-token:
    required: false
  pypi-username:
    default: __token__
  pypi-password:
    required: false
  nuget-publish-key:
    required: false
  maven-username:
    required: false
  maven-password:
    required: false
  maven-signing-key:
    required: false
  maven-signing-password:
    required: false
  maven-publish-repo-url:
    required: false
  maven-staging-url:
    required: false
  pulumi-version:
    default: "^3"
  pulumictl-version:
    default: v0.0.50
  node-version:
    default: "20.x"
  python-version:
    default: "3.11"
  go-version:
    default: "1.25"
  dotnet-version:
    default: "8.0.x"
  java-version:
    default: "11"

outputs:
  published:
    value: ${{ steps.pending.outputs.sdk }}

runs:
  using: composite
  steps:
    - name: Download package schema
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: package-schema
        path: schema

    - name: Determine unpublished versions
      id: pending
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
        CANDIDATES: ${{ inputs.sdks }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        python3 "${ACTION_DIR}/../../scripts/check_published.py" \
          --coordinates schema/coordinates.json \
          --languages "${CANDIDATES}" \
          --version "${VERSION}"

    - name: Validate publication credentials
      if: steps.pending.outputs.any == 'true'
      shell: bash
      env:
        SDKS: ${{ steps.pending.outputs.sdk }}
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
        PYPI_PASSWORD: ${{ inputs.pypi-password }}
        NUGET_PUBLISH_KEY: ${{ inputs.nuget-publish-key }}
        PUBLISH_REPO_USERNAME: ${{ inputs.maven-username }}
        PUBLISH_REPO_PASSWORD: ${{ inputs.maven-password }}
        SIGNING_KEY: ${{ inputs.maven-signing-key }}
        SIGNING_PASSWORD: ${{ inputs.maven-signing-password }}
      run: |
        set -euo pipefail
        missing=()
        selected=",${SDKS},"
        if [[ "${selected}" == *,nodejs,* && -z "${NODE_AUTH_TOKEN}" ]]; then missing+=(npm-token); fi
        if [[ "${selected}" == *,python,* && -z "${PYPI_PASSWORD}" ]]; then missing+=(pypi-password); fi
        if [[ "${selected}" == *,dotnet,* && -z "${NUGET_PUBLISH_KEY}" ]]; then missing+=(nuget-publish-key); fi
        if [[ "${selected}" == *,java,* ]]; then
          [[ -n "${PUBLISH_REPO_USERNAME}" ]] || missing+=(maven-username)
          [[ -n "${PUBLISH_REPO_PASSWORD}" ]] || missing+=(maven-password)
          [[ -n "${SIGNING_KEY}" ]] || missing+=(maven-signing-key)
          [[ -n "${SIGNING_PASSWORD}" ]] || missing+=(maven-signing-password)
        fi
        if (( ${#missing[@]} > 0 )); then
          printf '::error title=Missing publication credentials::Required inputs are absent: %s\n' "${missing[*]}" >&2
          exit 1
        fi

    - name: Install Pulumi CLI
      if: steps.pending.outputs.any == 'true'
      uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
      with:
        pulumi-version: ${{ inputs.pulumi-version }}

    - name: Set up Go
      if: steps.pending.outputs.any == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - name: Install pulumictl
      if: steps.pending.outputs.any == 'true'
      shell: bash
      env:
        PULUMICTL_VERSION: ${{ inputs.pulumictl-version }}
      run: |
        set -euo pipefail
        go install "github.com/pulumi/pulumictl/cmd/pulumictl@${PULUMICTL_VERSION}"
        sudo install -m 0755 "$(go env GOPATH)/bin/pulumictl" /usr/local/bin/pulumictl

    - name: Set up Node.js
      if: steps.pending.outputs.any == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: https://registry.npmjs.org

    - name: Set up Python
      if: steps.pending.outputs.any == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up .NET
      if: steps.pending.outputs.any == 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Set up Java
      if: steps.pending.outputs.any == 'true'
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Publish SDKs
      if: steps.pending.outputs.any == 'true'
      uses: pulumi/pulumi-package-publisher@3ec1409d3e894142b9825c7859be8e57d362762a # v0.0.23
      with:
        sdk: ${{ steps.pending.outputs.sdk }}
        version: ${{ inputs.version }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
        PYPI_USERNAME: ${{ inputs.pypi-username }}
        PYPI_PASSWORD: ${{ inputs.pypi-password }}
        NUGET_PUBLISH_KEY: ${{ inputs.nuget-publish-key }}
        PUBLISH_REPO_USERNAME: ${{ inputs.maven-username }}
        PUBLISH_REPO_PASSWORD: ${{ inputs.maven-password }}
        SIGNING_KEY: ${{ inputs.maven-signing-key }}
        SIGNING_PASSWORD: ${{ inputs.maven-signing-password }}
        PUBLISH_REPO_URL: ${{ inputs.maven-publish-repo-url }}
        PUBLISH_STAGING_URL: ${{ inputs.maven-staging-url }}

    - name: Verify published versions are readable
      if: steps.pending.outputs.any == 'true'
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
        PUBLISHED_SDKS: ${{ steps.pending.outputs.sdk }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        python3 "${ACTION_DIR}/../../scripts/verify_published.py" \
          --coordinates schema/coordinates.json \
          --languages "${PUBLISHED_SDKS}" \
          --version "${VERSION}"

    - name: Report publication
      shell: bash
      env:
        SKIPPED: ${{ steps.pending.outputs.skipped }}
        PUBLISHED: ${{ steps.pending.outputs.sdk }}
      run: |
        {
          echo "### SDK publication"
          echo
          echo "- published: \`${PUBLISHED:-none}\`"
          echo "- already published, skipped: \`${SKIPPED:-none}\`"
        } >> "$GITHUB_STEP_SUMMARY"
