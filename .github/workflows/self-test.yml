name: Self test

# Exercises the reusable workflow through a real `workflow_call`, in dry-run mode.
# This is the only check that proves the workflow_call interface itself resolves:
# input typing, job graph, artifact names and the publish guards.
#
# No secrets are passed and publish stays false, so nothing can be published.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-mode-dry-run:
    name: Registry mode (dry run)
    uses: ./.github/workflows/publish-terraform-provider-sdks.yml
    permissions:
      contents: read
    with:
      mode: registry
      terraform-provider: descope/descope
      terraform-provider-version: 0.3.16
      languages: nodejs,python,go,dotnet,java,yaml
      publish: false
      nodejs-package-name: "@descope/pulumi-descope"
      python-package-name: descope_pulumi_descope
      go-sdk-repository: omercnet/pulumi-terraform-provider-publisher
      go-sdk-path: sdk/go
      dotnet-root-namespace: Descope.Pulumi
      java-base-package: com.descope.pulumi
