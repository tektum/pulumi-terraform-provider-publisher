name: Self test

# Exercises both supported public surfaces in dry-run mode: the full reusable
# workflow and the registry-only root action. No publishing credentials are passed.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-mode-dry-run:
    name: Registry mode (dry run)
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write # reusable publish-go job's maximum; publish=false skips that job
    with:
      terraform-provider: descope/descope
      terraform-provider-version: 0.3.16
      namespace: descope
      languages: nodejs,python,go,dotnet,java,yaml
      publish: false
      go-sdk-repository: tektum/pulumi-terraform-provider-publisher
      go-sdk-path: sdk/go

  root-action-dry-run:
    name: Root action (registry dry run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate through root action
        uses: ./
        with:
          terraform-provider: descope/descope
          terraform-provider-version: 0.3.16
          namespace: descope
          languages: nodejs,yaml
          publish: false
