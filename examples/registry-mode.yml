# Minimal registry-backed caller. Copy to .github/workflows/publish-pulumi-sdks.yml.
# The root action is registry-only: it never executes caller-controlled build code.
name: Publish Pulumi SDKs

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Exact Terraform provider version
        required: true
        type: string
      publish:
        description: Publish instead of generation-only validation
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish-pulumi-sdks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required only when Go publication is selected
    steps:
      - name: Generate, validate, and publish Pulumi SDKs
        uses: tektum/pulumi-terraform-provider-publisher@v1.0.0
        with:
          terraform-provider: descope/descope
          terraform-provider-version: ${{ inputs.version || github.ref_name }}
          # Optional: defaults to the Terraform registry namespace (descope).
          namespace: descope
          publish: ${{ inputs.publish || github.ref_type == 'tag' }}

          npm-token: ${{ secrets.NPM_TOKEN }}
          pypi-password: ${{ secrets.PYPI_API_TOKEN }}
          nuget-publish-key: ${{ secrets.NUGET_PUBLISH_KEY }}
          maven-username: ${{ secrets.SONATYPE_USERNAME }}
          maven-password: ${{ secrets.SONATYPE_PASSWORD }}
          maven-signing-key: ${{ secrets.PGP_PRIVATE_KEY }}
          maven-signing-password: ${{ secrets.PGP_PASSPHRASE }}
