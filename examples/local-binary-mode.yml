# Advanced checked-out-source caller. Local build code stays in credential-free
# jobs; publication runs in separate jobs through the reusable workflow.
name: Publish Pulumi SDKs from source

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-pulumi-sdks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write # maximum required by the isolated Go publication job
    uses: tektum/pulumi-terraform-provider-publisher/.github/workflows/publish.yml@v1.0.0
    with:
      mode: local
      provider-binary-path: bin/terraform-provider-descope
      build-command: go build -o bin/terraform-provider-descope .
      sdk-version: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev.1' }}

      # Replace the runner-local path in parameterization metadata with the released
      # registry provider that SDK consumers must resolve.
      runtime-provider: descope/descope
      runtime-provider-version: ${{ github.ref_type == 'tag' && github.ref_name || '0.3.16' }}

      namespace: descope
      languages: nodejs,python,go,dotnet,java,yaml
      publish: ${{ github.ref_type == 'tag' }}
      assert-prerelease: ${{ github.ref_type != 'tag' }}
      go-sdk-repository: descope/pulumi-descope
      go-sdk-path: sdk/go
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}
      pypi-password: ${{ secrets.PYPI_API_TOKEN }}
      nuget-publish-key: ${{ secrets.NUGET_PUBLISH_KEY }}
      maven-username: ${{ secrets.SONATYPE_USERNAME }}
      maven-password: ${{ secrets.SONATYPE_PASSWORD }}
      maven-signing-key: ${{ secrets.PGP_PRIVATE_KEY }}
      maven-signing-password: ${{ secrets.PGP_PASSPHRASE }}
